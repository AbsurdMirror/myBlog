<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>{{ page.title }} · {{ config.site_name }}</title><link rel="stylesheet" href="{{ 'site.css'|url }}"></head>
<body><header class="topbar"><a class="brand" href="{{ 'index.html'|url }}">图解技术笔记</a><span class="topmeta">MODEL NOTES</span></header>
<aside class="sidebar"><p class="series-label">技术解析</p><strong>{{ config.site_name }}</strong><p class="sidebar-note">结构 · 数学 · 实现</p><details class="site-links"><summary>其他文档</summary>{% for item in nav %}<a href="{{ item.url|url }}">{{ item.title }}</a><br>{% endfor %}</details><nav id="page-toc" aria-label="本页目录"></nav><div class="side-foot"><a href="{{ 'index.html'|url }}">首页</a> · <a href="{{ 'legacy/index.html'|url }}">旧文归档</a><br><a href="{{ config.repo_url }}">源码仓库</a></div></aside>
<main><div class="edition"><span>TECHNICAL NOTES</span>{% if page.meta.status != 'published' %}<span class="badge">DRAFT · 待确认</span>{% endif %}</div><article class="doc">{{ page.content }}</article><footer>由 Markdown 构建 · 图片可放大查看 · {{ page.meta.updated or '' }}</footer></main><script src="{{ 'viewer.js'|url }}"></script></body></html>
