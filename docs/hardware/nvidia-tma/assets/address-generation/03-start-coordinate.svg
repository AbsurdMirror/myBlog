<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="630" viewBox="0 0 1400 630" role="img"><title>Im2col 起点坐标转换：同一点的 Global 与 Box 坐标</title><desc>左图在同一个实际取数点旁标记Global坐标(2,1)及Box坐标(3,2)。Pixel Box原点在Global坐标系中为(-1,-1)。右侧给出两方向坐标转换关系。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#647784"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:25px;fill:#263e4b}.title{font-size:33px;font-weight:600}.head{font-size:28px;font-weight:600}.small{font-size:23px;fill:#647784}.formula{font-size:26px}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:26px}.green{fill:#5d9778}</style><rect x="0" y="0" width="1400" height="630" fill="#fcfbf8" stroke="none" rx="22"/><text x="36" y="54" class="title" text-anchor="start">起点坐标转换：一个点，两套坐标</text><text x="36" y="94" class="small" text-anchor="start">固定 N=0、C=0、Cslice=1；仅显示 W / H。</text><text x="100" y="158" class="head" text-anchor="start">Global Tensor 与 Pixel Box</text><rect x="160" y="210" width="325" height="260" fill="#f7e6cf" stroke="none" /><rect x="225" y="275" width="260" height="195" fill="#dcecf5" stroke="#7d9fb7" /><path d="M160 210L160 470" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M225 210L225 470" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M290 210L290 470" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M355 210L355 470" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M420 210L420 470" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M485 210L485 470" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M160 210L485 210" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M160 275L485 275" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M160 340L485 340" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M160 405L485 405" fill="none" stroke="#dedbd5" stroke-width="2"  /><path d="M160 470L485 470" fill="none" stroke="#dedbd5" stroke-width="2"  /><rect x="160" y="210" width="325" height="260" fill="none" stroke="#bb824b" stroke-width="3"/><path d="M144 275L520 275" fill="none" stroke="#647784" stroke-width="2" marker-end="url(#arrow)" /><path d="M225 192L225 502" fill="none" stroke="#647784" stroke-width="2" marker-end="url(#arrow)" /><text x="529" y="283" class="small" text-anchor="start">W</text><text x="217" y="532" class="small" text-anchor="start">H</text><text x="148" y="217" class="small" text-anchor="end">−1</text><text x="213" y="263" class="small" text-anchor="end">0</text><text x="485" y="263" class="small" text-anchor="middle">4</text><text x="213" y="477" class="small" text-anchor="end">3</text><circle cx="160" cy="210" r="8" fill="#bb824b"/><text x="100" y="191" class="small" text-anchor="start">Box 原点：Global (−1,−1)</text><circle cx="355" cy="340" r="10" fill="#5d9778"/><text x="373" y="332" class="green" text-anchor="start">Global 坐标 (2,1)</text><text x="373" y="370" class="green" text-anchor="start">Box 坐标 (3,2)</text><path d="M695 164L695 535" fill="none" stroke="#dddcd5" stroke-width="2"  /><text x="760" y="191" class="head" text-anchor="start">坐标转换</text><text x="760" y="223" class="small" text-anchor="start">Box 原点在 Global 中为 (−1,−1)</text><text x="760" y="273" class="formula" text-anchor="start">Box 坐标 = Global 坐标 − Box 原点</text><text x="760" y="319" class="mono" text-anchor="start">(3,2) = (2,1) − (−1,−1)</text><text x="760" y="405" class="formula" text-anchor="start">Global 坐标 = Box 坐标 + Box 原点</text><text x="760" y="451" class="mono" text-anchor="start">(2,1) = (3,2) + (−1,−1)</text><path d="M36 558L1364 558" fill="none" stroke="#dddcd5" stroke-width="2"  /><rect x="55" y="580" width="22" height="22" fill="#dcecf5" stroke="none" /><text x="88" y="599" class="small" text-anchor="start">Global 有效范围</text><rect x="365" y="580" width="22" height="22" fill="#f7e6cf" stroke="#bb824b" /><text x="398" y="599" class="small" text-anchor="start">Pixel Box 范围</text><circle cx="718" cy="591" r="10" fill="#5d9778"/><text x="740" y="599" class="small" text-anchor="start">同一个实际取数起点</text></svg>
