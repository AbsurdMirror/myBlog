<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img"><title>Im2col 通道分组</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#647784"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:23px;fill:#263e4b}.title{font-size:33px;font-weight:600}.head{font-size:27px;font-weight:600}.small{font-size:20px;fill:#647784}.tiny{font-size:18px;fill:#647784}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:22px}.white{fill:#fff}.purple{fill:#8769b0}.green{fill:#5d9778}.center{text-anchor:middle}</style><rect x="0" y="0" width="1400" height="750" rx="22" fill="#fcfbf8" stroke="none" /><text x="36" y="52" class="title" text-anchor="start">通道分组：完整通道编号 → C / Cslice</text><text x="36" y="91" class="small" text-anchor="start">有效通道 10 个，每组 4 个；紫色始终表示同一个通道 9。</text><text x="60" y="156" class="head" text-anchor="start">完整通道向量</text><rect x="60" y="185" width="52" height="57" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="86" y="222" class="" text-anchor="middle">0</text><rect x="117" y="185" width="52" height="57" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="143" y="222" class="" text-anchor="middle">1</text><rect x="174" y="185" width="52" height="57" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="200" y="222" class="" text-anchor="middle">2</text><rect x="231" y="185" width="52" height="57" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="257" y="222" class="" text-anchor="middle">3</text><rect x="288" y="185" width="52" height="57" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="314" y="222" class="" text-anchor="middle">4</text><rect x="345" y="185" width="52" height="57" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="371" y="222" class="" text-anchor="middle">5</text><rect x="402" y="185" width="52" height="57" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="428" y="222" class="" text-anchor="middle">6</text><rect x="459" y="185" width="52" height="57" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="485" y="222" class="" text-anchor="middle">7</text><rect x="516" y="185" width="52" height="57" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="542" y="222" class="" text-anchor="middle">8</text><rect x="573" y="185" width="52" height="57" rx="5" fill="#8769b0" stroke="#8769b0" /><text x="599" y="222" class="white" text-anchor="middle">9</text><text x="60" y="284" class="small" text-anchor="start">普通布局：一组包含全部 10 个通道</text><text x="60" y="320" class="mono" text-anchor="start">globalShape[C] = 10</text><text x="60" y="356" class="mono" text-anchor="start">globalShape[Cslice] = 1</text><path d="M660 211L765 211" fill="none" stroke="#647784" stroke-width="2" marker-end="url(#arrow)" /><text x="711" y="183" class="small" text-anchor="middle">每 4 个分组</text><text x="850" y="156" class="head" text-anchor="start">分组后的二维坐标</text><text x="1037" y="195" class="small" text-anchor="middle">组内 C</text><text x="926" y="229" class="small" text-anchor="middle">0</text><text x="1004" y="229" class="small" text-anchor="middle">1</text><text x="1082" y="229" class="small" text-anchor="middle">2</text><text x="1160" y="229" class="small" text-anchor="middle">3</text><text x="826" y="281" class="small" text-anchor="end">Cslice=0</text><rect x="890" y="246" width="72" height="62" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="926" y="286" class="" text-anchor="middle">0</text><rect x="968" y="246" width="72" height="62" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="1004" y="286" class="" text-anchor="middle">1</text><rect x="1046" y="246" width="72" height="62" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="1082" y="286" class="" text-anchor="middle">2</text><rect x="1124" y="246" width="72" height="62" rx="5" fill="#dcecf5" stroke="#aab3ba" /><text x="1160" y="286" class="" text-anchor="middle">3</text><text x="826" y="351" class="small" text-anchor="end">Cslice=1</text><rect x="890" y="316" width="72" height="62" rx="5" fill="#f7e6cf" stroke="#aab3ba" /><text x="926" y="356" class="" text-anchor="middle">4</text><rect x="968" y="316" width="72" height="62" rx="5" fill="#f7e6cf" stroke="#aab3ba" /><text x="1004" y="356" class="" text-anchor="middle">5</text><rect x="1046" y="316" width="72" height="62" rx="5" fill="#f7e6cf" stroke="#aab3ba" /><text x="1082" y="356" class="" text-anchor="middle">6</text><rect x="1124" y="316" width="72" height="62" rx="5" fill="#f7e6cf" stroke="#aab3ba" /><text x="1160" y="356" class="" text-anchor="middle">7</text><text x="826" y="421" class="small" text-anchor="end">Cslice=2</text><rect x="890" y="386" width="72" height="62" rx="5" fill="#e4f1e9" stroke="#aab3ba" /><text x="926" y="426" class="" text-anchor="middle">8</text><rect x="968" y="386" width="72" height="62" rx="5" fill="#8769b0" stroke="#8769b0" /><text x="1004" y="426" class="white" text-anchor="middle">9</text><rect x="1046" y="386" width="72" height="62" rx="5" fill="#e9ebed" stroke="#aab3ba" /><text x="1082" y="426" class="small" text-anchor="middle">无效</text><rect x="1124" y="386" width="72" height="62" rx="5" fill="#e9ebed" stroke="#aab3ba" /><text x="1160" y="426" class="small" text-anchor="middle">无效</text><text x="850" y="504" class="mono" text-anchor="start">globalShape[C] = 4</text><text x="850" y="540" class="mono" text-anchor="start">globalShape[Cslice] = 3</text><path d="M36 582L1350 582" fill="none" stroke="#dddcd5" stroke-width="2"  /><text x="60" y="626" class="mono" text-anchor="start">C = channel % 4</text><text x="570" y="626" class="mono" text-anchor="start">Cslice = floor(channel / 4)</text><text x="60" y="670" class="mono" text-anchor="start">channel = 9 → C = 1，Cslice = 2</text><text x="60" y="711" class="small" text-anchor="start">最后一组的编号 10、11 超过有效通道数，使用填充值。</text></svg>
