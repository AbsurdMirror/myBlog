<rect x="1150" y="115" width="395" height="585" class="box green"/>
<text x="1347" y="160" class="h" text-anchor="middle">Shared-memory tile</text>
<text x="1347" y="194" class="s" text-anchor="middle">swizzle 规定到达 shared 后的排布</text>
<g stroke="#425b61" stroke-width="2">
<rect x="1205" y="245" width="70" height="58" fill="#dff1f5"/><rect x="1275" y="245" width="70" height="58" fill="#fde7c7"/><rect x="1345" y="245" width="70" height="58" fill="#e4f3df"/><rect x="1415" y="245" width="70" height="58" fill="#f7e2e4"/>
<rect x="1205" y="303" width="70" height="58" fill="#fde7c7"/><rect x="1275" y="303" width="70" height="58" fill="#e4f3df"/><rect x="1345" y="303" width="70" height="58" fill="#f7e2e4"/><rect x="1415" y="303" width="70" height="58" fill="#dff1f5"/>
<rect x="1205" y="361" width="70" height="58" fill="#e4f3df"/><rect x="1275" y="361" width="70" height="58" fill="#f7e2e4"/><rect x="1345" y="361" width="70" height="58" fill="#dff1f5"/><rect x="1415" y="361" width="70" height="58" fill="#fde7c7"/>
</g>
<rect x="1205" y="465" width="280" height="105" class="box purple"/>
<text x="1345" y="506" class="h" text-anchor="middle">swizzle</text>
<text x="1345" y="541" class="s" text-anchor="middle">改变 shared 中的 bank 排列</text>
<rect x="1205" y="595" width="280" height="62" class="box"/>
<text x="1345" y="634" class="s" text-anchor="middle">逻辑坐标保持不变</text>

<rect x="165" y="755" width="1270" height="92" class="box"/>
<text x="800" y="793" class="h" text-anchor="middle">同一描述符中的字段并不作用于同一个位置</text>
<text x="800" y="827" class="b" text-anchor="middle">interleave 解释 global 布局 · l2Promotion 控制 fetch 建议 · oobFill 处理边界 · swizzle 组织 shared 排布</text>
</svg>
