name: Publish documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.2
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python scripts/build_static.py --require-legacy
      - run: python scripts/check_site.py
      - name: Publish to existing Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages
          git worktree add --detach .pages origin/gh-pages
          rsync -a --delete --exclude=.git site/ .pages/
          cd .pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish documentation from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
          gh api --method POST repos/${GITHUB_REPOSITORY}/pages/builds
      - uses: actions/upload-artifact@v4
        with:
          name: publication-site
          path: site
          retention-days: 30
