<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#243238}.t{font-size:38px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.box{fill:#fffdf7;stroke:#425b61;stroke-width:3;rx:22}.blue{fill:#dff1f5}.green{fill:#e4f3df}.orange{fill:#fde7c7}.pink{fill:#f7e2e4}.purple{fill:#ece5f6}.line{stroke:#425b61;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:11 9}
</style>
<rect width="1600" height="900" fill="#fbf8ef"/>
<text x="70" y="66" class="t">前向卷积：Im2col 把滑动窗口转换为矩阵乘法</text>

<rect x="55" y="115" width="350" height="620" class="box blue"/>
<text x="230" y="158" class="h" text-anchor="middle">① 输入张量</text>
<text x="230" y="192" class="b" text-anchor="middle">Input[N, H, W, Cin]</text>
<g fill="#fffdf7" stroke="#789096" stroke-width="2">
<rect x="105" y="240" width="250" height="250"/>
<path d="M155 240V490 M205 240V490 M255 240V490 M305 240V490"/>
<path d="M105 290H355 M105 340H355 M105 390H355 M105 440H355"/>
</g>
<rect x="155" y="290" width="150" height="150" fill="#fde7c7" fill-opacity="0.75" stroke="#425b61" stroke-width="5" rx="9"/>
<text x="230" y="365" class="h" text-anchor="middle">R × S</text>
<rect x="95" y="535" width="270" height="125" class="box orange"/>
<text x="230" y="574" class="h" text-anchor="middle">一个输出位置</text>
<text x="230" y="608" class="s" text-anchor="middle">对应一个 R×S×Cin patch</text>
<text x="230" y="638" class="s" text-anchor="middle">窗口在 N、H、W 上移动</text>

<path d="M405 420H500" class="line"/><path d="M484 408L500 420L484 432" class="line"/>
<text x="452" y="394" class="s" text-anchor="middle">展开</text>

<rect x="500" y="115" width="390" height="620" class="box orange"/>
<text x="695" y="158" class="h" text-anchor="middle">② Im2col 激活矩阵 A</text>
<text x="695" y="193" class="b" text-anchor="middle">A[M, K]</text>
<text x="695" y="225" class="s" text-anchor="middle">M = N×P×Q　　K = R×S×Cin</text>
<g stroke="#425b61" stroke-width="2">
<rect x="565" y="280" width="260" height="66" fill="#dff1f5"/>
<rect x="565" y="346" width="260" height="66" fill="#fde7c7"/>
<rect x="565" y="412" width="260" height="66" fill="#e4f3df"/>
<rect x="565" y="478" width="260" height="66" fill="#f7e2e4"/>
<rect x="565" y="544" width="260" height="66" fill="#ece5f6"/>
</g>
<text x="695" y="321" class="b" text-anchor="middle">patch 0 展平：K 个元素</text>
<text x="695" y="387" class="b" text-anchor="middle">patch 1 展平：K 个元素</text>
<text x="695" y="453" class="b" text-anchor="middle">patch 2 展平：K 个元素</text>
<text x="695" y="519" class="b" text-anchor="middle">patch 3 展平：K 个元素</text>
<text x="695" y="585" class="b" text-anchor="middle">…</text>
<text x="695" y="654" class="s" text-anchor="middle">每一行对应一个输出空间位置</text>
<text x="695" y="684" class="s" text-anchor="middle">TMA im2col 负责取数并组织该数据块</text>

<text x="930" y="432" class="t" text-anchor="middle">×</text>

<rect x="975" y="115" width="245" height="315" class="box purple"/>
<text x="1097" y="158" class="h" text-anchor="middle">③ 权重矩阵 B</text>
<text x="1097" y="194" class="b" text-anchor="middle">B[K, Cout]</text>
<g stroke="#425b61" stroke-width="2">
<rect x="1030" y="245" width="45" height="125" fill="#dff1f5"/>
<rect x="1075" y="245" width="45" height="125" fill="#fde7c7"/>
<rect x="1120" y="245" width="45" height="125" fill="#e4f3df"/>
</g>
<text x="1097" y="402" class="s" text-anchor="middle">每列对应一个输出通道</text>

<path d="M1220 420H1280" class="line"/><path d="M1264 408L1280 420L1264 432" class="line"/>

<rect x="1280" y="115" width="265" height="620" class="box green"/>
<text x="1412" y="158" class="h" text-anchor="middle">④ GEMM 结果 C</text>
<text x="1412" y="194" class="b" text-anchor="middle">C[M, Cout]</text>
<g stroke="#425b61" stroke-width="2">
<rect x="1335" y="245" width="155" height="48" fill="#dff1f5"/>
<rect x="1335" y="293" width="155" height="48" fill="#fde7c7"/>
<rect x="1335" y="341" width="155" height="48" fill="#e4f3df"/>
<rect x="1335" y="389" width="155" height="48" fill="#f7e2e4"/>
</g>
<text x="1412" y="474" class="s" text-anchor="middle">每一行已经是一个</text>
<text x="1412" y="502" class="s" text-anchor="middle">输出位置的 Cout 个值</text>
<path d="M1412 535V585" class="line"/><path d="M1400 569L1412 585L1424 569" class="line"/>
<rect x="1315" y="585" width="195" height="95" class="box pink"/>
<text x="1412" y="621" class="h" text-anchor="middle">逻辑 reshape</text>
<text x="1412" y="653" class="s" text-anchor="middle">[N, P, Q, Cout]</text>

<rect x="165" y="780" width="1270" height="84" class="box"/>
<text x="800" y="814" class="h" text-anchor="middle">前向卷积不需要 col2im</text>
<text x="800" y="846" class="s" text-anchor="middle">GEMM 的 M 行与 N×P×Q 个输出位置一一对应；epilogue 可直接按目标输出布局写回</text>
</svg>
